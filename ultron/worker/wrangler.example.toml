# A seller's own worker for Ultron (ultron/worker/index.js). Copy next to index.js and
# agent.js as wrangler.toml, fill it in, then: npx wrangler deploy
#
# Secrets (npx wrangler secret put <NAME>): TELEGRAM_BOT_TOKEN, GITHUB_TOKEN (fine-grained, Actions:
# write on the bots repo), WEBHOOK_SECRET, ALLOWED_CHAT_IDS (comma-separated), AGENT_TOKEN (any long
# random string; the same value goes in the repo's AGENT_WORKER_TOKEN secret).
name = "example-ultron"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
AGENT_REPO = "example-owner/example-bots"

# the same workflows and inputs as [actions] in agent.toml
[vars.AGENT_ACTIONS]
sale = { workflow = "sale.yml", inputs = ["from", "to"] }
invpush = { workflow = "inv-push.yml", inputs = ["dry_run"] }

# Workers AI on the account's free daily allocation
[ai]
binding = "AI"

# pending approvals (npx wrangler kv namespace create AGENT_KV, then paste its id)
[[kv_namespaces]]
binding = "AGENT_KV"
id = "<kv namespace id>"
