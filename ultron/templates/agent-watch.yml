name: Agent watch

on:
  # The agent checks every bot run as it finishes (python -m ultron watch) and tells Telegram only
  # when something is wrong. List the seller's bot workflows by their `name:`.
  workflow_run:
    workflows: ["Daily sale report", "OMSGuru inventory push"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "The bot run to check (its id is in the run's URL)"
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: agent-watch-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
      # a public repo: the run's log is uploaded only encrypted (ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      AGENT_WORKER_URL: ${{ secrets.AGENT_WORKER_URL }}
      AGENT_WORKER_TOKEN: ${{ secrets.AGENT_WORKER_TOKEN }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WATCH_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./ultron[full]"
      - name: Check the run
        run: bash ultron/templates/ci_run.sh watch --run-id "$WATCH_RUN_ID"
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-watch-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 14
