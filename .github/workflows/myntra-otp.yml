name: Myntra courier OTP

on:
  # Started by the Telegram bot's Cloudflare cron (worker/src/worker.js): 10 AM IST, and 11 AM IST with
  # retry=1. Not GitHub's own schedule: it ran hours late or not at all (24 Oct 2026: no 11 AM run).
  workflow_dispatch:
    inputs:
      retry:
        description: "1 = send only OTPs the earlier run did not have"
        default: ""

concurrency:
  group: myntra-otp
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
      RUN_MODE: github-actions
      # the repo is public: the run's log and output are uploaded only encrypted (scripts/github/ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # the Myntra sessions are read from the worker with the dashboard token
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      MYNTRA_OTP_SITES: ${{ vars.MYNTRA_OTP_SITES }}
      # the team's Daily OTP sheet (shared with the service account as editor)
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      MYNTRA_OTP_SHEET_ID: ${{ vars.MYNTRA_OTP_SHEET_ID }}
      IN_RETRY: ${{ inputs.retry }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Send the OTPs
        run: |
          set --
          if [ -n "$IN_RETRY" ]; then set -- --retry; fi
          bash scripts/github/ci_run.sh myntra-otp "$@"
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myntra-otp-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 3
