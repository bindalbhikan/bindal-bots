name: Ultron tests

# The agent package on every system it is hosted on: Linux, Windows, macOS with the full install,
# and the minimal pure-Python install that Android (Termux) gets.
on:
  push:
    paths: ["ultron/**", ".github/workflows/ultron.yml"]
  pull_request:
    paths: ["ultron/**", ".github/workflows/ultron.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        install: ["full"]
        include:
          - os: ubuntu-latest
            install: "minimal"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ultron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (full)
        if: matrix.install == 'full'
        run: pip install ".[full,test]"
      - name: Install (minimal, as on Termux)
        if: matrix.install == 'minimal'
        run: pip install . pytest
      - run: ultron version
      - run: python -m pytest -q
