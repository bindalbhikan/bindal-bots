name: Evening summary

on:
  # 8 PM IST (14:30 UTC). GitHub's own schedule, not the Telegram bot's Cloudflare cron: its free
  # plan's 5 triggers are all used.
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: evening
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
      RUN_MODE: github-actions
      # the repo is public: the run's log and output are uploaded only encrypted (scripts/github/ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      OMSGURU_EMAIL: ${{ secrets.OMSGURU_EMAIL }}
      OMSGURU_PASSWORD: ${{ secrets.OMSGURU_PASSWORD }}
      OMSGURU_OTP: ${{ secrets.OMSGURU_OTP }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # the agent's free model (/api/ai) is reached through the worker
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run summary
        run: bash scripts/github/ci_run.sh evening
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evening-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 7
