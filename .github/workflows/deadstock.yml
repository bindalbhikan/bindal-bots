name: Dead stock report

on:
  # The 1st of the month, 11 AM IST (05:30 UTC). GitHub's own schedule, not the Telegram bot's
  # Cloudflare cron: its free plan's 5 triggers are all used.
  schedule:
    - cron: "30 5 1 * *"
  workflow_dispatch:

concurrency:
  group: deadstock
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # inventory export (1-10 min) + 90 days of OMSGuru order lines
    env:
      TZ: Asia/Kolkata
      RUN_MODE: github-actions
      # the repo is public: the run's log and output are uploaded only encrypted (scripts/github/ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      OMSGURU_EMAIL: ${{ secrets.OMSGURU_EMAIL }}
      OMSGURU_PASSWORD: ${{ secrets.OMSGURU_PASSWORD }}
      OMSGURU_OTP: ${{ secrets.OMSGURU_OTP }}
      DEAD_SALE_DAYS: ${{ vars.DEAD_SALE_DAYS }}
      DEAD_MIN_STOCK: ${{ vars.DEAD_MIN_STOCK }}
      DEAD_SLOW_DAYS: ${{ vars.DEAD_SLOW_DAYS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # the agent's free model (/api/ai) is reached through the worker
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run report
        run: bash scripts/github/ci_run.sh deadstock
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadstock-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 30
