name: Weekly review

on:
  # Monday 10:15 AM IST (04:45 UTC). GitHub's own schedule, not the Telegram bot's Cloudflare cron:
  # its free plan's 5 triggers are all used.
  schedule:
    - cron: "45 4 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
      RUN_MODE: github-actions
      # the repo is public: the run's log and output are uploaded only encrypted (scripts/github/ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      OMSGURU_EMAIL: ${{ secrets.OMSGURU_EMAIL }}
      OMSGURU_PASSWORD: ${{ secrets.OMSGURU_PASSWORD }}
      OMSGURU_OTP: ${{ secrets.OMSGURU_OTP }}
      ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
      ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
      ERP_USER_TOKEN: ${{ secrets.ERP_USER_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # the agent's free model (/api/ai) is reached through the worker
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run review
        run: bash scripts/github/ci_run.sh weekly
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 14
