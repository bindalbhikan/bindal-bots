name: Myntra VMS report

on:
  # The daily run (5:30 PM IST) is started by the Telegram bot's Cloudflare cron (worker/src/worker.js).
  workflow_dispatch:
    inputs:
      from:
        description: "Back-fill: first SLA date (YYYY-MM-DD), empty = normal daily run"
        default: ""
      to:
        description: "Back-fill: last SLA date (YYYY-MM-DD), empty = today"
        default: ""
      snapshot:
        description: "Picture of a month sheet instead of the report (current or YYYY-MM)"
        default: ""
      erp_only:
        description: "1 = only ERP vs VMS (packed yesterday and today)"
        default: ""
      chat_id:
        description: "Telegram chat for this run's report (empty = default chat)"
        default: ""

concurrency:
  group: vms
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kolkata
      RUN_MODE: github-actions
      # the repo is public: the run's log and output are uploaded only encrypted (scripts/ci_run.sh)
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      OMSGURU_EMAIL: ${{ secrets.OMSGURU_EMAIL }}
      OMSGURU_PASSWORD: ${{ secrets.OMSGURU_PASSWORD }}
      OMSGURU_OTP: ${{ secrets.OMSGURU_OTP }}
      VMS_USERNAME: ${{ secrets.VMS_USERNAME }}
      VMS_PASSWORD: ${{ secrets.VMS_PASSWORD }}
      VMS_DRIVE_FILE_ID: ${{ secrets.VMS_DRIVE_FILE_ID }}
      ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
      ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
      ERP_USER_TOKEN: ${{ secrets.ERP_USER_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
      MYNTRA_CHANNELS: ${{ vars.MYNTRA_CHANNELS }}
      SLA_LOOKBACK_DAYS: ${{ vars.SLA_LOOKBACK_DAYS }}
      VMS_REPORT_DAYS: ${{ vars.VMS_REPORT_DAYS }}
      IN_FROM: ${{ inputs.from }}
      IN_TO: ${{ inputs.to }}
      IN_SNAPSHOT: ${{ inputs.snapshot }}
      IN_ERP_ONLY: ${{ inputs.erp_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          libreoffice: ${{ inputs.snapshot != '' }}
      - name: Run report
        run: |
          if [ -n "$IN_SNAPSHOT" ]; then
            bash scripts/ci_run.sh vms --snapshot "$IN_SNAPSHOT"
          elif [ -n "$IN_ERP_ONLY" ]; then
            bash scripts/ci_run.sh vms --erp-only
          elif [ -n "$IN_FROM" ]; then
            bash scripts/ci_run.sh vms --from "$IN_FROM" ${IN_TO:+--to "$IN_TO"}
          else
            bash scripts/ci_run.sh vms
          fi
      - name: Upload run output (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms-${{ github.run_id }}
          path: secure/
          if-no-files-found: ignore
          retention-days: 14
