<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; color: #111; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  label { display: block; margin-top: 8px; color: #555; }
  input { width: 100%; box-sizing: border-box; padding: 5px; margin-top: 2px; }
  button { margin-top: 10px; padding: 6px 10px; cursor: pointer; }
  #status { margin-top: 10px; padding: 8px; background: #f3f4f6; border-radius: 6px; white-space: pre-line; }
</style>
</head>
<body>
  <h1>Bindal Myntra Session</h1>
  <div id="status">…</div>
  <button id="sync">Send now</button>
  <label>Worker URL <input id="workerUrl"></label>
  <label>Token (DASHBOARD_TOKEN) <input id="token" type="password"></label>
  <button id="save">Save</button>
  <script src="popup.js"></script>
</body>
</html>
