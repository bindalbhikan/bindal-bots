name = "bindal-dashboard"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# The page is bundled as text.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Same namespace the Telegram worker writes the bots' numbers into (also remembers used
# sign-in links for an hour).
[[kv_namespaces]]
binding = "DASH"
id = "67db94fc82af438496705a09419c2ac3"

# Secret (wrangler secret put / bulk): SESSION_KEY - the same value as in the Telegram worker,
# which signs the sign-in links. Without it the dashboard serves nothing.
