name = "bindal-dashboard"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# The page is bundled as text.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Same namespace the Telegram worker writes the bots' numbers into.
[[kv_namespaces]]
binding = "DASH"
id = "67db94fc82af438496705a09419c2ac3"

[vars]
# Cloudflare Access (email one-time code) in front of this worker. Until both are set the
# dashboard refuses every request. Team domain: <team>.cloudflareaccess.com; AUD: the
# "Application Audience (AUD) Tag" of the Access application for this workers.dev URL.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
