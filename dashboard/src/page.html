<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bindal Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --good-text: #006300; --bad-text: #b42f2f;
    --seq-1: #86b6ef; --seq-2: #5598e7; --seq-3: #2a78d6; --seq-4: #1c5cab;
    --accent: #2a78d6; --accent-ink: #ffffff; --chip: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --raised: #222221;
      --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --good-text: #0ca30c; --bad-text: #e66767;
      --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #6da7ec;
      --accent: #3987e5; --chip: #2c2c2a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222221;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good-text: #0ca30c; --bad-text: #e66767;
    --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #6da7ec;
    --accent: #3987e5; --chip: #2c2c2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .grow { flex: 1; min-width: 0; }
  .btn {
    border: 1px solid var(--ring); background: var(--raised); color: var(--ink);
    border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer;
    min-height: 40px;
  }
  .btn:hover { background: var(--chip); }
  .btn:focus-visible, .tab:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 860px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card {
    background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 14px;
    min-width: 0;
  }
  .kpi .label { color: var(--ink-2); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .kpi .value { font-size: 28px; font-weight: 650; margin-top: 4px; letter-spacing: -0.02em; }
  .kpi .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .up { color: var(--good-text); } .down { color: var(--bad-text); }

  .runs { display: flex; gap: 8px; margin: 14px 0 6px; overflow-x: auto; scrollbar-width: none; }
  .runs::-webkit-scrollbar, .tabs::-webkit-scrollbar { display: none; }
  .run {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); white-space: nowrap; flex: none;
    background: var(--surface); border: 1px solid var(--ring); border-radius: 999px; padding: 5px 10px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .tabs {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; padding: 10px 0; margin-top: 8px;
    background: var(--page); overflow-x: auto; scrollbar-width: none;
  }
  .tab {
    border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; min-height: 40px;
  }
  @media (max-width: 520px) {
    .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tab { padding: 8px 4px; font-size: 13.5px; }
  }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 860px) { .grid.two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }
  h2 { font-size: 15px; margin: 0 0 2px; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .tip {
    position: fixed; pointer-events: none; z-index: 20; background: var(--raised); color: var(--ink);
    border: 1px solid var(--ring); border-radius: 10px; padding: 8px 10px; font-size: 12.5px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12); display: none; max-width: 240px;
  }
  .tip b { display: block; margin-bottom: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { font-variant-numeric: tabular-nums; }
  tr.total td { font-weight: 650; border-bottom: none; }
  .scroll { overflow-x: auto; }
  .bar { height: 6px; border-radius: 3px; background: var(--s1); min-width: 2px; }
  .barcell { width: 34%; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .chip {
    border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2); border-radius: 999px;
    padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; min-height: 34px;
  }
  .chip[aria-pressed="true"] { background: var(--chip); color: var(--ink); border-color: var(--axis); font-weight: 600; }
  input[type="search"] {
    flex: 1; min-width: 140px; border: 1px solid var(--ring); background: var(--raised); color: var(--ink);
    border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13.5px; min-height: 34px;
  }
  .list { max-height: 420px; overflow-y: auto; }
  .tag { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .notes { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; }
  .error { color: var(--bad-text); }
  [hidden] { display: none !important; }
  @media (max-width: 520px) { .hide-sm { display: none; } }
  @media (forced-colors: active) { .bar, .sw, .dot { forced-color-adjust: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="grow">
      <h1>Bindal Exports</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <button class="btn" id="refresh" type="button" aria-label="Refresh">↻</button>
    <button class="btn" id="theme" type="button" aria-label="Switch light / dark">◐</button>
    <a class="btn" href="/logout" aria-label="Sign out" title="Sign out" style="text-decoration:none;display:inline-flex;align-items:center">⎋</a>
  </header>

  <section class="kpis" id="kpis" aria-label="Today at a glance"></section>
  <div class="runs" id="runs" aria-label="Last run of each bot"></div>

  <nav class="tabs" role="tablist" aria-label="Reports">
    <button class="tab" role="tab" data-tab="sale" aria-selected="true">📈 Sale</button>
    <button class="tab" role="tab" data-tab="vms" aria-selected="false">📹 VMS</button>
    <button class="tab" role="tab" data-tab="tat" aria-selected="false" title="AJIO TAT">📦 TAT</button>
    <button class="tab" role="tab" data-tab="spf" aria-selected="false" title="AJIO SPF">🧾 SPF</button>
  </nav>

  <main>
    <section id="tab-sale" class="grid"></section>
    <section id="tab-vms" class="grid" hidden></section>
    <section id="tab-tat" class="grid" hidden></section>
    <section id="tab-spf" class="grid" hidden></section>
  </main>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const nf = new Intl.NumberFormat("en-IN");
const n = (v) => nf.format(Math.round(v || 0));
const rs = (v) => "₹" + nf.format(Math.round(v || 0));
const pct = (a, b) => (b ? (a / b) * 100 : 0);
const pf = (v) => (Math.round(v * 10) / 10).toFixed(1) + "%";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dt = (s) => new Date(s.length === 10 ? s + "T00:00:00" : s);
const dshort = (s) => dt(s).toLocaleDateString("en-IN", { day: "numeric", month: "short" });
const when = (s) => (s ? dt(s).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "—");
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let DATA = {};

// ------------------------------------------------------------------ theme
const THEME_KEY = "bindal-theme";
try { const t = localStorage.getItem(THEME_KEY); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, document.documentElement.dataset.theme); } catch {}
  render();
};

// ------------------------------------------------------------------ tabs
const TAB_KEY = "bindal-tab";
function showTab(name) {
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  ["sale", "vms", "tat", "spf"].forEach((t) => ($("#tab-" + t).hidden = t !== name));
  try { localStorage.setItem(TAB_KEY, name); } catch {}
  render();
}
document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));

// ------------------------------------------------------------------ tooltip
const tip = $("#tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = Math.max(8, e.clientY - tip.offsetHeight - 12);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => (tip.style.display = "none");
addEventListener("scroll", hideTip, { passive: true });

// ------------------------------------------------------------------ charts (plain SVG)
// Bars: one value per x, or stacked segments; 4px rounded top, 2px gap between segments.
function barChart(el, rows, series, opts = {}) {
  const W = Math.max(280, el.clientWidth || 600), H = opts.height || 190;
  const pad = { t: 10, r: 6, b: 24, l: 36 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const totals = rows.map((r) => series.reduce((a, s) => a + (r[s.key] || 0), 0));
  const max = niceMax(Math.max(1, ...totals));
  const bw = iw / Math.max(1, rows.length), bar = Math.max(3, Math.min(28, bw * 0.7));
  const y = (v) => pad.t + ih - (v / max) * ih;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "")}">`;
  for (const t of [0, 0.5, 1]) {
    const v = max * t, yy = y(v);
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${yy}" y2="${yy}" stroke="${css(t ? "--grid" : "--axis")}" stroke-width="1"/>`;
    svg += `<text x="${pad.l - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="${css("--muted")}">${short(v)}</text>`;
  }
  const every = Math.ceil(rows.length / Math.max(4, Math.floor(iw / 46)));
  rows.forEach((r, i) => {
    const cx = pad.l + bw * i + bw / 2;
    let base = 0;
    series.forEach((s, si) => {
      const v = r[s.key] || 0; if (!v) return;
      const top = y(base + v), bot = y(base);
      const h = Math.max(1, bot - top - (si ? 2 : 0));
      const isTop = series.slice(si + 1).every((s2) => !(r[s2.key] > 0));
      svg += isTop
        ? `<path d="${roundTop(cx - bar / 2, top, bar, h, Math.min(4, bar / 2, h))}" fill="${s.color}"/>`
        : `<rect x="${cx - bar / 2}" y="${top}" width="${bar}" height="${h}" fill="${s.color}"/>`;
      base += v;
    });
    if (i % every === 0 || i === rows.length - 1) {
      svg += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="11" fill="${css("--muted")}">${esc(opts.xlabel ? opts.xlabel(r) : r.x)}</text>`;
    }
    svg += `<rect x="${pad.l + bw * i}" y="${pad.t}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
  });
  el.innerHTML = svg + "</svg>";
  el.querySelectorAll("rect[data-i]").forEach((hit) => {
    const r = rows[+hit.dataset.i];
    const html = `<b>${esc(opts.title ? opts.title(r) : r.x)}</b>` +
      series.map((s) => `<span class="tag"><i class="sw" style="background:${s.color}"></i>${esc(s.name)}: ${n(r[s.key])}</span><br>`).join("") +
      (series.length > 1 ? `Total: ${n(series.reduce((a, s) => a + (r[s.key] || 0), 0))}` : "");
    hit.addEventListener("pointermove", (e) => showTip(e, html));
    hit.addEventListener("pointerleave", hideTip);
  });
}

// Lines: one or more series over the same x, 2px lines, crosshair tooltip.
function lineChart(el, rows, series, opts = {}) {
  const W = Math.max(280, el.clientWidth || 600), H = opts.height || 190;
  const pad = { t: 10, r: 44, b: 24, l: 36 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const vals = rows.flatMap((r) => series.map((s) => r[s.key])).filter((v) => v != null);
  const lo = opts.min ?? Math.max(0, Math.floor((Math.min(...vals) - 5) / 10) * 10);
  const hi = opts.max ?? 100;
  const x = (i) => pad.l + (rows.length < 2 ? iw / 2 : (iw * i) / (rows.length - 1));
  const y = (v) => pad.t + ih - ((v - lo) / (hi - lo)) * ih;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "")}">`;
  for (const v of [lo, (lo + hi) / 2, hi]) {
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css(v === lo ? "--axis" : "--grid")}"/>`;
    svg += `<text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${css("--muted")}">${Math.round(v)}%</text>`;
  }
  const every = Math.ceil(rows.length / Math.max(4, Math.floor(iw / 46)));
  rows.forEach((r, i) => {
    if (i % every === 0 || i === rows.length - 1) svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="${css("--muted")}">${esc(r.x)}</text>`;
  });
  series.forEach((s) => {
    const pts = rows.map((r, i) => (r[s.key] == null ? null : [x(i), y(r[s.key])]));
    let d = "", pen = false;
    pts.forEach((p) => { if (!p) { pen = false; return; } d += (pen ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); pen = true; });
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = [...pts].reverse().find(Boolean);
    if (last) svg += `<text x="${last[0] + 6}" y="${last[1] + 4}" font-size="11" fill="${css("--ink-2")}">${esc(s.name)}</text>`;
  });
  svg += `<line id="xh" x1="0" x2="0" y1="${pad.t}" y2="${pad.t + ih}" stroke="${css("--axis")}" visibility="hidden"/>`;
  svg += `<rect x="${pad.l}" y="${pad.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"/>`;
  el.innerHTML = svg + "</svg>";
  const hit = el.querySelector(".hit"), xh = el.querySelector("#xh"), sv = el.querySelector("svg");
  hit.addEventListener("pointermove", (e) => {
    const box = sv.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    const i = Math.max(0, Math.min(rows.length - 1, Math.round(((px - pad.l) / iw) * (rows.length - 1))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    const r = rows[i];
    showTip(e, `<b>${esc(opts.title ? opts.title(r) : r.x)}</b>` + series.map((s) =>
      `<span class="tag"><i class="sw" style="background:${s.color}"></i>${esc(s.name)}: ${r[s.key] == null ? "—" : pf(r[s.key])}</span><br>`).join(""));
  });
  hit.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); hideTip(); });
}

function roundTop(x, y, w, h, r) {
  return `M${x} ${y + h}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h}Z`;
}
function niceMax(v) { const p = 10 ** Math.floor(Math.log10(v)); return Math.ceil(v / p) * p; }
function short(v) { return v >= 1e5 ? (v / 1e5).toFixed(1) + "L" : v >= 1000 ? (v / 1000).toFixed(v >= 1e4 ? 0 : 1) + "k" : String(Math.round(v)); }
function legend(items) { return `<div class="legend">${items.map((s) => `<span><i class="sw" style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`; }
function card(title, hint, body) { return `<article class="card"><h2>${title}</h2>${hint ? `<p class="hint">${hint}</p>` : ""}${body}</article>`; }
function empty(what) { return card(what, "", `<div class="empty">No data yet — it appears after the next run.</div>`); }
function copyBtn(id, label) { return `<button class="chip" type="button" id="${id}">${label}</button>`; }
function wireCopy(id, getText) {
  const b = document.getElementById(id); if (!b) return;
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(getText()); b.textContent = "Copied ✓"; } catch { b.textContent = "Copy failed"; }
    setTimeout(() => (b.textContent = b.dataset.label || "Copy AWBs"), 1600);
  };
  b.dataset.label = b.textContent;
}

// ------------------------------------------------------------------ data helpers
const SALE_TOTAL = (d) => Object.values(d.gross || {}).reduce((a, v) => a + v, 0);
function monthOf(s) { return s.slice(0, 7); }
function vmsTotals(day) { let o = 0, v = 0; for (const [a, b] of Object.values(day.codes)) { o += a; v += b; } return [o, v]; }

// ------------------------------------------------------------------ KPIs + runs
function renderTop() {
  const k = [];
  const sale = DATA.sale;
  if (sale && sale.days?.length) {
    const days = sale.days.filter((d) => SALE_TOTAL(d) > 0);
    const last = days[days.length - 1], prev = days[days.length - 2];
    const mtd = sale.days.filter((d) => monthOf(d.date) === monthOf(sale.day)).reduce((a, d) => a + SALE_TOTAL(d), 0);
    const ch = prev ? pct(SALE_TOTAL(last) - SALE_TOTAL(prev), SALE_TOTAL(prev)) : null;
    k.push(kpi("📈 Sale · " + (last ? dshort(last.date) : ""), last ? n(SALE_TOTAL(last)) : "—",
      (ch == null ? "" : `<span class="${ch >= 0 ? "up" : "down"}">${ch >= 0 ? "▲" : "▼"} ${pf(Math.abs(ch))}</span> vs day before · `) + `Month ${n(mtd)}`));
  } else k.push(kpi("📈 Sale", "—", "no data yet"));
  const vms = DATA.vms;
  if (vms && vms.days?.length) {
    const last = vms.days[vms.days.length - 1], [o, v] = vmsTotals(last);
    const month = vms.days.filter((d) => monthOf(d.date) === monthOf(vms.day));
    const mo = month.reduce((a, d) => a + vmsTotals(d)[0], 0), mv = month.reduce((a, d) => a + vmsTotals(d)[1], 0);
    k.push(kpi("📹 VMS · SLA " + dshort(last.date), pf(pct(v, o)), `${n(v)} of ${n(o)} · Month ${pf(pct(mv, mo))}`));
  } else k.push(kpi("📹 VMS", "—", "no data yet"));
  const tat = DATA.ajio_tat;
  if (tat) {
    const over = tat.pickup_pending.filter((p) => p.over).length, due = tat.pickup_pending.length - over;
    k.push(kpi("📦 Pickup pending", `<span class="${over ? "down" : ""}">${n(over)}</span>`, `TAT over · ${n(due)} still due`));
  } else k.push(kpi("📦 Pickup pending", "—", "no data yet"));
  const spf = DATA.ajio_spf;
  if (spf) {
    const value = spf.open_by_age.reduce((a, b) => a + b.value, 0);
    k.push(kpi("🧾 Open returns", n(spf.open), `${rs(value)} invoice value · ${n(spf.open_with_ticket)} with ticket`));
  } else k.push(kpi("🧾 Open returns", "—", "no data yet"));
  $("#kpis").innerHTML = k.join("");

  const bots = [["sale", "Sale"], ["vms", "VMS"], ["ajio_tat", "AJIO TAT"], ["ajio_spf", "AJIO SPF"]];
  $("#runs").innerHTML = bots.map(([key, name]) => {
    const r = DATA["run_" + key];
    if (!r) return `<span class="run"><i class="dot" style="background:${css("--axis")}"></i>${name} · no run yet</span>`;
    const col = r.ok ? css("--good") : css("--critical");
    const title = r.ok ? `Done in ${r.minutes} min` : `Failed: ${r.error}`;
    const today = new Date().toDateString() === dt(r.started_at).toDateString();
    const at = today ? dt(r.started_at).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }) : when(r.started_at);
    return `<span class="run" title="${esc(title)}"><i class="dot" style="background:${col}"></i>${r.ok ? "" : "⚠ "}${name} · ${at}</span>`;
  }).join("");
  const latest = Object.values(DATA).filter(Boolean).map((v) => v.published_at).filter(Boolean).sort().pop();
  $("#updated").textContent = latest ? "Updated " + when(latest) : "No data yet";
}
function kpi(label, value, meta) {
  return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="meta">${meta}</div></div>`;
}

// ------------------------------------------------------------------ Sale
function renderSale() {
  const el = $("#tab-sale"), sale = DATA.sale;
  if (!sale) { el.innerHTML = empty("Daily sale"); return; }
  const month = monthOf(sale.day);
  const cur = sale.days.filter((d) => monthOf(d.date) === month);
  const prevMonth = sale.days.filter((d) => monthOf(d.date) !== month);
  const upto = cur.length ? +cur[cur.length - 1].date.slice(8) : 0;
  const prevSame = prevMonth.filter((d) => +d.date.slice(8) <= upto);
  const sum = (days, ch) => days.reduce((a, d) => a + (d.gross[ch] || 0), 0);
  const total = sale.channels.reduce((a, ch) => a + sum(cur, ch), 0);
  const prevTotal = sale.channels.reduce((a, ch) => a + sum(prevSame, ch), 0);
  const maxCh = Math.max(1, ...sale.channels.map((ch) => sum(cur, ch)));
  const mName = dt(sale.day).toLocaleDateString("en-IN", { month: "long" });
  const today = DATA.sale_today;
  const rows = sale.channels.map((ch) => {
    const v = sum(cur, ch), p = sum(prevSame, ch), c = p ? pct(v - p, p) : null;
    return `<tr><td>${esc(ch)}</td><td class="barcell"><div class="bar" style="width:${(v / maxCh) * 100}%"></div></td>
      <td class="num">${n(v)}</td><td class="num ${c == null ? "" : c >= 0 ? "up" : "down"}">${c == null ? "—" : (c >= 0 ? "+" : "") + Math.round(c) + "%"}</td></tr>`;
  }).join("");
  const tc = prevTotal ? pct(total - prevTotal, prevTotal) : null;
  el.className = "grid two";
  el.innerHTML =
    card(`Daily gross · ${mName}`, "Units by order date, all channels", `<div class="chart" id="c-sale"></div>`) +
    card(`Channels · ${mName} 1–${upto}`, "vs the same days last month",
      `<div class="scroll"><table><thead><tr><th>Channel</th><th></th><th class="num">Gross</th><th class="num">vs last</th></tr></thead>
       <tbody>${rows}<tr class="total"><td>Total</td><td></td><td class="num">${n(total)}</td>
       <td class="num ${tc == null ? "" : tc >= 0 ? "up" : "down"}">${tc == null ? "—" : (tc >= 0 ? "+" : "") + Math.round(tc) + "%"}</td></tr></tbody></table></div>`) +
    (today ? card(`Today so far · ${when(today.at)}`, "From the last “Sale today” run",
      `<table><tbody>${Object.entries(today.gross).map(([c, v]) => `<tr><td>${esc(c)}</td><td class="num">${n(v)}</td></tr>`).join("")}
       <tr class="total"><td>Total</td><td class="num">${n(Object.values(today.gross).reduce((a, b) => a + b, 0))}</td></tr></tbody></table>`) : "") +
    (sale.notes?.length ? card("Notes", "", `<ul class="notes">${sale.notes.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`) : "");
  barChart($("#c-sale"), cur.map((d) => ({ x: d.date.slice(8).replace(/^0/, ""), date: d.date, total: SALE_TOTAL(d) })),
    [{ key: "total", name: "Gross", color: css("--s1") }],
    { label: "Daily gross units", title: (r) => dshort(r.date) });
}

// ------------------------------------------------------------------ VMS
let vmsCode = "All", vmsQuery = "";
function renderVms() {
  const el = $("#tab-vms"), vms = DATA.vms;
  if (!vms) { el.innerHTML = empty("Myntra VMS"); return; }
  const month = vms.days.filter((d) => monthOf(d.date) === monthOf(vms.day));
  const colors = [css("--s1"), css("--s2"), css("--s3")];
  const series = vms.codes.map((c, i) => ({ key: c, name: c, color: colors[i % 3] }));
  const rows = month.map((d) => Object.fromEntries([["x", d.date.slice(8).replace(/^0/, "")], ["date", d.date],
    ...vms.codes.map((c) => [c, d.codes[c][0] ? pct(d.codes[c][1], d.codes[c][0]) : null])]));
  const table = month.slice().reverse().map((d) => {
    const [o, v] = vmsTotals(d);
    return `<tr><td>${dshort(d.date)}</td>${vms.codes.map((c) => `<td class="num">${d.codes[c][0] ? pf(pct(d.codes[c][1], d.codes[c][0])) : "—"}</td>`).join("")}
      <td class="num hide-sm">${n(v)}/${n(o)}</td><td class="num"><b>${pf(pct(v, o))}</b></td></tr>`;
  }).join("");
  const list = (vms.no_vms || []).filter((r) => (vmsCode === "All" || r.code === vmsCode) && (!vmsQuery || String(r.awb).toLowerCase().includes(vmsQuery)));
  el.className = "grid two";
  el.innerHTML =
    card("VMS % by SLA date", "Orders with a packing video", `<div class="chart" id="c-vms"></div>${legend(series)}`) +
    card("Day by day", "",
      `<div class="scroll list"><table><thead><tr><th>SLA</th>${vms.codes.map((c) => `<th class="num">${c}</th>`).join("")}<th class="num hide-sm">VMS/Orders</th><th class="num">Total</th></tr></thead><tbody>${table}</tbody></table></div>`) +
    card(`NO VMS · ${n((vms.no_vms || []).length)} AWB`, vms.label_errors ? `${vms.label_errors} label(s) could not be read` : "Latest run's SLA dates",
      `<div class="chips">${["All", ...vms.codes].map((c) => `<button class="chip" type="button" data-code="${c}" aria-pressed="${c === vmsCode}">${c}</button>`).join("")}
        <input type="search" id="vms-q" placeholder="Search AWB" value="${esc(vmsQuery)}" aria-label="Search AWB">${copyBtn("vms-copy", "Copy AWBs")}</div>
       <div class="scroll list"><table><thead><tr><th>AWB</th><th>Code</th><th class="num">SLA</th></tr></thead>
       <tbody>${list.map((r) => `<tr><td>${esc(r.awb)}</td><td>${esc(r.code)}</td><td class="num">${dshort(r.date)}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">Nothing here 🎉</td></tr>`}</tbody></table></div>`);
  lineChart($("#c-vms"), rows, series, { label: "VMS percent by SLA date", title: (r) => "SLA " + dshort(r.date) });
  el.querySelectorAll("[data-code]").forEach((b) => (b.onclick = () => { vmsCode = b.dataset.code; renderVms(); }));
  const q = $("#vms-q"); q.oninput = () => { vmsQuery = q.value.trim().toLowerCase(); renderVms(); const nq = $("#vms-q"); nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); };
  wireCopy("vms-copy", () => list.map((r) => r.awb).join("\n"));
  renderErp(el);
}

// ERP vs VMS: parcels packed in the ERP yesterday and today, and whether VMS has their video.
let erpCode = "All", erpPacker = "All", erpQuery = "";
function renderErp(el) {
  const erp = DATA.vms_erp;
  const box = document.createElement("div");
  box.style.display = "contents";
  el.appendChild(box);
  if (!erp) { box.innerHTML = empty("🏭 ERP vs VMS"); return; }
  const codes = erp.codes.filter((c) => c !== "OTHER" || erp.total[c][0]);
  const table = (counts) => {
    let to = 0, tv = 0;
    const rows = codes.map((c) => {
      const [o, v] = counts[c] || [0, 0]; to += o; tv += v;
      return `<tr><td>${esc(c)}</td><td class="num">${n(o)}</td><td class="num">${n(v)}</td><td class="num">${n(o - v)}</td><td class="num"><b>${pf(pct(v, o))}</b></td></tr>`;
    }).join("");
    return `<table><thead><tr><th>Code</th><th class="num">Packed</th><th class="num">VMS</th><th class="num">No VMS</th><th class="num">%</th></tr></thead>
       <tbody>${rows}<tr class="total"><td>Total</td><td class="num">${n(to)}</td><td class="num">${n(tv)}</td><td class="num">${n(to - tv)}</td><td class="num">${pf(pct(tv, to))}</td></tr></tbody></table>`;
  };
  const recent = (erp.days || []).slice(-2).map((r, i, a) =>
    card(`📅 ${i === a.length - 1 ? "Today" : "Yesterday"} · ${dshort(r.date)}`, "Packed in the ERP that day, with a VMS video", table(r.codes))).join("");
  const packers = {};
  erp.missing.forEach((m) => (packers[m.packed_by || "—"] = (packers[m.packed_by || "—"] || 0) + 1));
  const byPacker = Object.entries(packers).sort((a, b) => b[1] - a[1]);
  const list = erp.missing.filter((m) => (erpCode === "All" || m.code === erpCode) && (erpPacker === "All" || (m.packed_by || "—") === erpPacker)
    && (!erpQuery || `${m.awb} ${m.skus}`.toLowerCase().includes(erpQuery)));
  const span = `${dshort(erp.from)} – ${dshort(erp.to)}`;
  box.innerHTML = recent +
    card(`🏭 ERP vs VMS · ${span}`, "Parcels packed in the ERP yesterday and today that have a VMS video",
      `${table(erp.total)}
       ${byPacker.length ? `<p class="hint" style="margin:12px 0 6px">No VMS by who packed</p><table><tbody>${byPacker.map(([p, c]) =>
         `<tr><td>${esc(p)}</td><td class="barcell"><div class="bar" style="width:${(c / byPacker[0][1]) * 100}%;background:${css("--s2")}"></div></td><td class="num">${n(c)}</td></tr>`).join("")}</tbody></table>` : ""}`) +
    card(`ERP NO VMS · ${n(erp.missing_count ?? erp.missing.length)} AWB`, erp.missing_count > erp.missing.length ? `Latest ${n(erp.missing.length)} shown · full list in the ERP NO VMS sheet` : "Packed in the ERP, no VMS scan",
      `<div class="chips">${["All", ...codes].map((c) => `<button class="chip" type="button" data-ecode="${c}" aria-pressed="${c === erpCode}">${c}</button>`).join("")}
        <select class="chip" id="erp-p" aria-label="Packed by">${["All", ...byPacker.map(([p]) => p)].map((p) => `<option ${p === erpPacker ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
        <input type="search" id="erp-q" placeholder="Search AWB / SKU" value="${esc(erpQuery)}" aria-label="Search AWB or SKU">${copyBtn("erp-copy", "Copy AWBs")}</div>
       <div class="scroll list"><table><thead><tr><th>AWB</th><th>Code</th><th class="hide-sm">Packed by</th><th class="num">Date</th></tr></thead>
       <tbody>${list.map((m) => `<tr><td title="${esc(m.skus)}">${esc(m.awb)}</td><td>${esc(m.code)}</td><td class="hide-sm">${esc(m.packed_by)}</td><td class="num">${dshort(m.date)}</td></tr>`).join("") ||
         `<tr><td colspan="4" class="empty">Nothing here 🎉</td></tr>`}</tbody></table></div>`);
  box.querySelectorAll("[data-ecode]").forEach((b) => (b.onclick = () => { erpCode = b.dataset.ecode; renderVms(); }));
  $("#erp-p").onchange = (e) => { erpPacker = e.target.value; renderVms(); };
  const q = $("#erp-q"); q.oninput = () => { erpQuery = q.value.trim().toLowerCase(); renderVms(); const nq = $("#erp-q"); nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); };
  wireCopy("erp-copy", () => list.map((m) => m.awb).join("\n"));
}

// ------------------------------------------------------------------ AJIO TAT
let tatFilter = "Over", tatCourier = "All";
function renderTat() {
  const el = $("#tab-tat"), tat = DATA.ajio_tat;
  if (!tat) { el.innerHTML = empty("AJIO TAT"); return; }
  const series = [
    { key: "correct", name: "TAT correct", color: css("--good") },
    { key: "not_correct", name: "Not correct", color: css("--critical") },
    { key: "pending", name: "Pending", color: css("--warning") },
  ];
  const days = tat.days.slice(-31);
  const tot = tat.couriers.reduce((a, c) => ({ orders: a.orders + c.orders, done: a.done + c.done, pend: a.pend + c.pend, due: a.due + c.due, proc: a.proc + c.proc }),
    { orders: 0, done: 0, pend: 0, due: 0, proc: 0 });
  const couriers = ["All", ...new Set(tat.pickup_pending.map((p) => p.courier))];
  const list = tat.pickup_pending.filter((p) => (tatFilter === "All" || (tatFilter === "Over") === p.over) && (tatCourier === "All" || p.courier === tatCourier));
  el.className = "grid two";
  el.innerHTML =
    card("TAT result by order date", "Last 31 days · cancelled orders left out", `<div class="chart" id="c-tat"></div>${legend(series)}`) +
    card("Couriers · this month", "Done = picked · Pend = TAT over, not picked · Due = TAT left · Proc = not processed",
      `<div class="scroll"><table><thead><tr><th>Courier</th><th class="num">Orders</th><th class="num">Done</th><th class="num">Pend</th><th class="num">Due</th><th class="num">Proc</th></tr></thead>
       <tbody>${tat.couriers.map((c) => `<tr><td>${esc(c.courier)}</td><td class="num">${n(c.orders)}</td><td class="num">${n(c.done)}</td>
         <td class="num ${c.pend ? "down" : ""}">${n(c.pend)}</td><td class="num">${n(c.due)}</td><td class="num">${n(c.proc)}</td></tr>`).join("")}
       <tr class="total"><td>Total</td><td class="num">${n(tot.orders)}</td><td class="num">${n(tot.done)}</td><td class="num">${n(tot.pend)}</td><td class="num">${n(tot.due)}</td><td class="num">${n(tot.proc)}</td></tr></tbody></table></div>`) +
    card(`Pickup pending · ${n(tat.pickup_pending.length)} AWB`, tat.lookup_errors ? `${tat.lookup_errors} lookup(s) failed in the last run` : "Packed, not picked by the courier",
      `<div class="chips">${["Over", "Due", "All"].map((f) => `<button class="chip" type="button" data-f="${f}" aria-pressed="${f === tatFilter}">${f === "Over" ? "🔴 TAT over" : f === "Due" ? "🟡 Due" : "All"}</button>`).join("")}
        <select class="chip" id="tat-c" aria-label="Courier">${couriers.map((c) => `<option ${c === tatCourier ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
        ${copyBtn("tat-copy", "Copy AWBs")}</div>
       <div class="scroll list"><table><thead><tr><th>AWB</th><th>Courier</th><th class="num">Ready</th><th class="num">TAT</th></tr></thead>
       <tbody>${list.map((p) => `<tr><td>${esc(p.awb)}</td><td>${esc(p.courier)}</td><td class="num">${p.ready ? dshort(p.ready) : "—"}</td>
         <td class="num"><span class="tag ${p.over ? "down" : ""}">${p.over ? "● Over" : "● Due"}</span></td></tr>`).join("") || `<tr><td colspan="4" class="empty">Nothing pending 🎉</td></tr>`}</tbody></table></div>`);
  barChart($("#c-tat"), days.map((d) => ({ ...d, x: d.date.slice(8).replace(/^0/, "") })), series,
    { label: "TAT result by order date", title: (r) => dshort(r.date) + ` · ${n(r.orders)} orders` });
  el.querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { tatFilter = b.dataset.f; renderTat(); }));
  $("#tat-c").onchange = (e) => { tatCourier = e.target.value; renderTat(); };
  wireCopy("tat-copy", () => list.map((p) => p.awb).join("\n"));
}

// ------------------------------------------------------------------ AJIO SPF
function renderSpf() {
  const el = $("#tab-spf"), spf = DATA.ajio_spf;
  if (!spf) { el.innerHTML = empty("AJIO SPF"); return; }
  const steps = [css("--seq-1"), css("--seq-2"), css("--seq-3"), css("--seq-4")];
  const maxAge = Math.max(1, ...spf.open_by_age.map((a) => a.count));
  const pk = spf.pickup || {};
  const kind = (t) => (/DISPUTE/.test(t) ? "Dispute" : /NOT DELIVERED/.test(t) ? "Not delivered" : t);
  el.className = "grid two";
  el.innerHTML =
    card(`Open returns by age · ${n(spf.open)}`, "Days since the return was created · invoice value",
      `<table><tbody>${spf.open_by_age.map((a, i) => `<tr><td>${a.age} days</td>
        <td class="barcell"><div class="bar" style="width:${(a.count / maxAge) * 100}%;background:${steps[i]}"></div></td>
        <td class="num">${n(a.count)}</td><td class="num">${rs(a.value)}</td></tr>`).join("")}</tbody></table>`) +
    card(`Run · ${dshort(spf.date)}`, spf.dry ? "🧪 Dry run — nothing posted" : "LIVE — posted on AJIO",
      `<table><tbody>
        <tr><td>Returns</td><td class="num">${n(spf.returns)}</td></tr>
        <tr><td>Received</td><td class="num">${n(spf.received)}</td></tr>
        <tr><td>Open · with ticket</td><td class="num">${n(spf.open)} · ${n(spf.open_with_ticket)}</td></tr>
        <tr><td>Tickets ${spf.dry ? "to raise" : "raised"}</td><td class="num">${n(spf.raised.filter((r) => ["created", "dry-run"].includes(r.result)).length)}</td></tr>
        <tr><td>Replies ${spf.dry ? "drafted" : "sent"}</td><td class="num">${n(spf.replies.length)}</td></tr>
        <tr><td>Coming: dispute · transit</td><td class="num">${n(spf.soon?.dispute)} · ${n(spf.soon?.transit)}</td></tr>
       </tbody></table>`) +
    card("Courier pickup · open returns", "From the courier's own tracking",
      `<table><tbody>${[["Picked up", pk["PICKED UP"]], ["Not picked up", pk["NOT PICKED UP"]], ["Pickup cancelled", pk["PICKUP CANCELLED"]],
        ["Pickup failed", pk["PICKUP FAILED"]], ["No tracking", pk["NO TRACKING"]]].map(([k, v]) => `<tr><td>${k}</td><td class="num">${n(v)}</td></tr>`).join("")}</tbody></table>`) +
    card(`Tickets this run · ${n(spf.raised.length)}`, "",
      spf.raised.length ? `<div class="scroll list"><table><thead><tr><th>Return</th><th>Type</th><th class="num">Amount</th><th>Result</th></tr></thead><tbody>
        ${spf.raised.map((r) => `<tr><td title="${esc(r.reason)}">${esc(r.return_order)}</td><td>${esc(kind(r.type))}</td><td class="num">${rs(r.amount)}</td><td>${esc(r.result)}</td></tr>`).join("")}
        </tbody></table></div>` : `<div class="empty">No ticket needed this run</div>`) +
    (spf.errors?.length ? card("⚠️ Errors", "Raising and replies were paused", `<ul class="notes error">${spf.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>`) : "");
}

// ------------------------------------------------------------------ main
function render() {
  renderTop();
  const tab = document.querySelector('.tab[aria-selected="true"]').dataset.tab;
  ({ sale: renderSale, vms: renderVms, tat: renderTat, spf: renderSpf })[tab]();
}
async function load() {
  $("#refresh").disabled = true;
  try {
    const res = await fetch("/api/data", { cache: "no-store" });
    if (!res.ok) throw new Error(await res.text());
    DATA = await res.json();
    render();
  } catch (e) {
    $("#updated").innerHTML = `<span class="error">Could not load: ${esc(e.message)}</span>`;
  } finally {
    $("#refresh").disabled = false;
  }
}
$("#refresh").onclick = load;
let resizeTimer; addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
try { const t = localStorage.getItem(TAB_KEY); if (t) document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t))); } catch {}
["sale", "vms", "tat", "spf"].forEach((t) => ($("#tab-" + t).hidden = document.querySelector('.tab[aria-selected="true"]').dataset.tab !== t));
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
