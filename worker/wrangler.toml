name = "bindal-telegram-bot"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Daily auto runs (UTC; IST = UTC + 5:30). Which report runs at which time: SCHEDULE in src/worker.js.
# The free plan allows 5 cron triggers per account; one trigger lists several hours, and
# monthly / weekly runs ride on daily ones.
#   1:30 UTC  ->  7:00 AM IST  Myntra report requests (SJIT, Myntra SPF; return analysis on the 15th)
#   3:30      ->  9:00 AM IST  Myntra SPF + AJIO SPF masters (AJIO tickets / replies Wed + Sat)
#   4:30      -> 10:00 AM IST  Myntra courier OTP, Myntra daily reports
#   5:30      -> 11:00 AM IST  Myntra courier OTP retry
#   8:30      ->  2:00 PM IST, only on the 15th  return analysis
#   10:00     ->  3:30 PM IST  sale
#   12:00     ->  5:30 PM IST  vms, ajiotat
[triggers]
crons = ["30 1,3,4,5,8 * * *", "0 10,12 * * *"]

[vars]
# Extra Telegram users allowed to send commands: the EXTRA_CHAT_IDS secret (comma-separated chat ids,
# from DMs with the bot), kept out of this file because the repo is public.
# Dashboard address for /dashboard sign-in links (SESSION_KEY secret signs them).
DASHBOARD_PAGE = "https://bindal-dashboard.bhikan-serein.workers.dev"

# Latest numbers of each bot for the dashboard (worker/../dashboard reads the same namespace).
# The bots POST them to /api/push/<key> with the DASHBOARD_TOKEN secret.
# Workers AI (free daily allocation) for the ops agent: POST /api/ai with the DASHBOARD_TOKEN.
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "DASH"
id = "67db94fc82af438496705a09419c2ac3"
